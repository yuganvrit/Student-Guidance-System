services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-student_guidance}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "7007:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sgs_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-student_guidance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "7770:6379"
    volumes:
      - redis_data:/data
    networks:
      - sgs_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:9009
    env_file:
      - .env
    environment:
      # listed after env_file, so these win — the container must reach the
      # compose services, not localhost
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-student_guidance}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "9009:9009"
    volumes:
      - .:/app
    networks:
      - sgs_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  sgs_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
